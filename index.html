<script>
const $=id=>document.getElementById(id),v=$('v'),log=$('log');
let file,tops,tr,mvts,M,mvhdX,TX={};
const tp=(b,o)=>String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);
const fmt=t=>{const m=Math.floor(t/60);return m+':'+(t-m*60).toFixed(2).padStart(5,'0')};
const pt=s=>s.trim().split(':').map(Number).reduce((a,x)=>a*60+x,0);
const rd1=async b=>{try{return await b.arrayBuffer()}catch(e1){try{return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(b)})}catch(e2){return await new Response(b).arrayBuffer()}}};
const rd=async b=>{let le;for(let k=0;k<4;k++){try{return await rd1(b)}catch(e){le=e;await new Promise(r=>setTimeout(r,250*(k+1)))}}throw le};
const enc=s=>new TextEncoder().encode(s);
const cat=l=>{l=l.flat(Infinity);const o=new Uint8Array(l.reduce((s,x)=>s+x.length,0));let p=0;for(const x of l){o.set(x,p);p+=x.length}return o};
const box=(t,l)=>{const p=cat(l),o=new Uint8Array(p.length+8);new DataView(o.buffer).setUint32(0,o.length);o.set(enc(t),4);o.set(p,8);return o};
const U=a=>{const o=new Uint8Array(a.length*4),d=new DataView(o.buffer);a.forEach((x,i)=>d.setUint32(i*4,x>>>0));return o};
const raw=x=>M.subarray(x.s,x.e);

async function boxes(){
 const out=[];let pos=0;
 while(file.size-pos>=8){
  const d=new DataView(await rd(file.slice(pos,pos+16)));
  let size=d.getUint32(0),hdr=8;const type=tp(new Uint8Array(d.buffer),4);
  if(size==1){size=Number(d.getBigUint64(8));hdr=16}else if(size==0)size=file.size-pos;
  if(size<hdr)break;
  out.push({type,pos,size,hdr});pos+=size;
 }
 return out;
}
function kids(b,s,e){
 const d=new DataView(b.buffer,b.byteOffset,b.length),r=[];
 while(s+8<=e){let z=d.getUint32(s),h=8;
  if(z==1){z=Number(d.getBigUint64(s+8));h=16}else if(z==0)z=e-s;
  if(z<h)break;r.push({t:tp(b,s+4),s,e:s+z,b:s+h});s+=z}
 return r;
}
function parse(b,hdr){
 M=b;const d=new DataView(b.buffer,b.byteOffset,b.length);
 const mc=kids(b,hdr,b.length);
 mvhdX=mc.find(x=>x.t=='mvhd');
 mvts=d.getUint32(mvhdX.b+(b[mvhdX.b]?20:12));
 tr=[];TX={};
 const mx=mc.find(x=>x.t=='mvex');
 if(mx)for(const x of kids(b,mx.b,mx.e))if(x.t=='trex')TX[d.getUint32(x.b+4)]=[d.getUint32(x.b+12),d.getUint32(x.b+16),d.getUint32(x.b+20)];
 for(const tk of mc.filter(x=>x.t=='trak')){
  const tc=kids(b,tk.b,tk.e),tkhd=tc.find(x=>x.t=='tkhd'),mdia=tc.find(x=>x.t=='mdia');
  const c2=kids(b,mdia.b,mdia.e),mdhd=c2.find(x=>x.t=='mdhd'),hdlr=c2.find(x=>x.t=='hdlr'),minf=c2.find(x=>x.t=='minf');
  const nc=kids(b,minf.b,minf.e),stbl=nc.find(x=>x.t=='stbl'),sc=kids(b,stbl.b,stbl.e),g=t=>sc.find(x=>x.t==t);
  const ts=d.getUint32(mdhd.b+(b[mdhd.b]?20:12)),type=tp(b,hdlr.b+8);
  const id=d.getUint32(tkhd.b+(b[tkhd.b]?20:12));
  if(!(g('stsz')&&g('stts')&&g('stsc')&&(g('stco')||g('co64')))){tr.push({tkhd,mdhd,hdlr,nc,stsd:g('stsd'),type,ts,n:0,id,cv:0,cto:null,sync:null});continue}
  const z=g('stsz'),ssz=d.getUint32(z.b+4),n=d.getUint32(z.b+8),sizes=new Uint32Array(n);
  for(let i=0;i<n;i++)sizes[i]=ssz||d.getUint32(z.b+12+4*i);
  const tt=g('stts'),delta=new Uint32Array(n);let k=0;
  for(let i=0,c=d.getUint32(tt.b+4);i<c;i++){const cnt=d.getUint32(tt.b+8+8*i),dl=d.getUint32(tt.b+12+8*i);for(let j=0;j<cnt&&k<n;j++)delta[k++]=dl}
  let cto=null,cv=0;const ct=g('ctts');
  if(ct){cv=b[ct.b];cto=new Int32Array(n);k=0;for(let i=0,c=d.getUint32(ct.b+4);i<c;i++){const cnt=d.getUint32(ct.b+8+8*i),o=d.getInt32(ct.b+12+8*i);for(let j=0;j<cnt&&k<n;j++)cto[k++]=o}}
  let sync=null;const ss=g('stss');
  if(ss){sync=new Uint8Array(n);for(let i=0,c=d.getUint32(ss.b+4);i<c;i++)sync[d.getUint32(ss.b+8+4*i)-1]=1}
  const co=g('stco')||g('co64'),is64=co.t=='co64',ncn=d.getUint32(co.b+4),sx=g('stsc'),ns=d.getUint32(sx.b+4),off=new Float64Array(n);
  let si=0;
  for(let e=0;e<ns;e++){
   const fc=d.getUint32(sx.b+8+12*e),spc=d.getUint32(sx.b+12+12*e),nx=e+1<ns?d.getUint32(sx.b+8+12*(e+1)):ncn+1;
   for(let c=fc;c<nx;c++){let o=is64?Number(d.getBigUint64(co.b+8+8*(c-1))):d.getUint32(co.b+8+4*(c-1));
    for(let j=0;j<spc&&si<n;j++){off[si]=o;o+=sizes[si++]}}
  }
  const dts=new Float64Array(n+1);for(let i=0;i<n;i++)dts[i+1]=dts[i]+delta[i];
  tr.push({id,tkhd,mdhd,hdlr,nc,stsd:g('stsd'),type,ts,n,sizes,delta,cto,cv,sync,off,dts});
 }
}
async function frag(){
 const acc={};tr.forEach(t=>{if(!t.n)acc[t.id]={t,sz:[],dl:[],ct:[],sy:[],of:[],hc:0}});
 for(const bx of tops){
  if(bx.type!='moof')continue;
  const b=new Uint8Array(await rd(file.slice(bx.pos,bx.pos+bx.size))),d=new DataView(b.buffer);
  for(const tf of kids(b,bx.hdr,b.length).filter(x=>x.t=='traf')){
   const c=kids(b,tf.b,tf.e),th=c.find(x=>x.t=='tfhd');
   const fl=d.getUint32(th.b)&0xffffff,id=d.getUint32(th.b+4),A=acc[id];if(!A)continue;
   let p=th.b+8,base=bx.pos;
   if(fl&1){base=Number(d.getBigUint64(p));p+=8}
   if(fl&2)p+=4;
   const df=TX[id]||[0,0,0];let dd=df[0],ds=df[1],dfl=df[2];
   if(fl&8){dd=d.getUint32(p);p+=4}
   if(fl&16){ds=d.getUint32(p);p+=4}
   if(fl&32){dfl=d.getUint32(p);p+=4}
   let cur=base;
   for(const tn of c.filter(x=>x.t=='trun')){
    const f=d.getUint32(tn.b)&0xffffff,cnt=d.getUint32(tn.b+4);let q=tn.b+8,o=cur,ff=null;
    if(f&1){o=base+d.getInt32(q);q+=4}
    if(f&4){ff=d.getUint32(q);q+=4}
    for(let i=0;i<cnt;i++){
     let du=dd,sz=ds,sf=(i==0&&ff!=null)?ff:dfl,co=0;
     if(f&0x100){du=d.getUint32(q);q+=4}
     if(f&0x200){sz=d.getUint32(q);q+=4}
     if(f&0x400){sf=d.getUint32(q);q+=4}
     if(f&0x800){co=d.getInt32(q);q+=4;A.hc=1}
     A.dl.push(du);A.sz.push(sz);A.ct.push(co);A.sy.push(sf&0x10000?0:1);A.of.push(o);o+=sz;
    }
    cur=o;
   }
  }
 }
 for(const id in acc){
  const A=acc[id],t=A.t,n=A.sz.length;if(!n)continue;
  t.n=n;t.sizes=Uint32Array.from(A.sz);t.delta=Uint32Array.from(A.dl);t.off=Float64Array.from(A.of);
  t.cto=A.hc?Int32Array.from(A.ct):null;t.cv=1;t.sync=A.sy.includes(0)?Uint8Array.from(A.sy):null;
  t.dts=new Float64Array(n+1);for(let i=0;i<n;i++)t.dts[i+1]=t.dts[i]+t.delta[i];
 }
}
let cuts=[],pend=null,D=0,prev=false,mode='del';
const msg=s=>log.textContent=s;
addEventListener('error',e=>msg('오류: '+e.message+' (줄 '+e.lineno+')'));
addEventListener('unhandledrejection',e=>msg('오류: '+(e.reason&&e.reason.message||e.reason)));
function keepSegs(){
 if(mode=='keep'){const m=[];cuts.map(c=>[Math.max(0,c[0]),Math.min(D,c[1])]).filter(c=>c[1]>c[0]).sort((x,y)=>x[0]-y[0]).forEach(c=>{const l=m[m.length-1];if(l&&c[0]<=l[1])l[1]=Math.max(l[1],c[1]);else m.push([...c])});return m}
 const m=[];[...cuts].sort((x,y)=>x[0]-y[0]).forEach(c=>{const l=m[m.length-1];if(l&&c[0]<=l[1])l[1]=Math.max(l[1],c[1]);else m.push([...c])});
 const k=[];let p=0;for(const[s,e]of m){if(s>p)k.push([p,s]);p=Math.max(p,e)}
 if(p<D)k.push([p,D]);return k;
}
const rng=(t,T,e,pb)=>{const g=T*t.ts-1;let a=pb;
 if(t.sync){
  if(mode=='keep'){let x=-1;for(let i=pb;i<t.n&&t.dts[i]<=g+1;i++)if(t.sync[i])x=i;if(x>=0)a=x;else while(a<t.n&&!t.sync[a])a++}
  else while(a<t.n&&!(t.sync[a]&&t.dts[a]>=g))a++}
 else while(a<t.n&&t.dts[a]<g)a++;
 let b=a;while(b<t.n&&t.dts[b]<e*t.ts)b++;
 return b>a?[a,b]:null};
function pack(t,pcs){
 let n=0;for(const p of pcs)n+=p.enc?p.enc.length:p.b-p.a;
 const sizes=new Uint32Array(n),delta=new Uint32Array(n),hasC=!!t.cto||pcs.some(p=>p.enc&&p.enc.some(f=>f.cto));
 const cto=hasC?new Int32Array(n):null,sync=(t.sync||pcs.some(p=>p.enc))?new Uint8Array(n):null,chunks=[],parts=[],ds=[];let k=0;
 for(const p of pcs){
  let len=0;
  if(p.enc){if(p.desc)ds.push(p.desc);const dd=p.desc?1+ds.length:1;for(const f of p.enc){sizes[k]=f.data.length;delta[k]=f.dur;if(cto)cto[k]=f.cto;if(sync)sync[k]=f.key?1:0;parts.push(f.data);len+=f.data.length;k++}chunks.push({n:p.enc.length,d:dd,len})}
  else{let c=null;for(let i=p.a;i<p.b;i++,k++){const o=t.off[i],z=t.sizes[i];sizes[k]=z;delta[k]=t.delta[i];if(cto&&t.cto)cto[k]=t.cto[i];if(sync)sync[k]=t.sync?t.sync[i]:1;
   if(c&&c[1]==o)c[1]+=z;else{c=[o,o+z];parts.push(c)}len+=z}chunks.push({n:p.b-p.a,d:1,len})}
 }
 const dts=new Float64Array(n+1);for(let i=0;i<n;i++)dts[i+1]=dts[i]+delta[i];
 let stsdB=null;
 const cs=cropSpec&&t.id==cropSpec.tid?cropSpec:null;
 if(ds.length||cs){const en=raw(t.stsd).subarray(16),dm=cs?[cs.cw,cs.ch]:null;stsdB=box('stsd',[U([0,1+ds.length]),cs?newEntry(en,cs.newDesc,dm):en,ds.map(x=>newEntry(en,x,dm))])}
 return{...t,n,sizes,delta,cto,sync,dts,chunks,parts,stsdB};
}
